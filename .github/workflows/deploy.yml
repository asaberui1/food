name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CJK fonts (分享卡渲染用)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig

      # npm run build 的 postbuild 会执行 test:search / audit:shops / test:fonts；
      # 地图点、菜单价格格式、搜索或字体清单任一失败都会阻断部署
      - name: Build site
        uses: withastro/action@v6
        with:
          path: .
          node-version: 22

      - name: Audit font coverage
        run: npm run test:fonts

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
